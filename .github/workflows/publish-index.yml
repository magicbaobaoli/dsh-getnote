name: Publish plugin index

# DSH 没有中心化的插件审核：索引就是一份静态 JSON，谁把它放到静态主机上谁就能
# 被安装。这个 workflow 在每次发版（打 v* 标签）时重新生成 index.json 并发布到
# GitHub Pages，用户把它当作「索引源」地址填进 DSH 的插件市场即可。
#
# 关键点：index.json 里的 git 源必须钉到具体 commit，而那个 commit 必须包含
# 本次发布的内容 —— 所以生成索引要放在 checkout 之后、且生成结果要提交进仓库，
# 否则「索引指向的 commit」里没有 index.json 自己（对安装没影响，但会让人困惑）。
#
# 这个 workflow 只负责「生成并提交 index.json」，发布交给 GitHub 内建的 Pages 构建。
# 原因：本仓库 Pages 的 build_type 是 legacy（直接从 main 分支构建），而
# actions/deploy-pages@v4 要求 build_type 为「GitHub Actions」，两者互斥；另外
# github-pages 环境的部署分支策略只允许 main/gh-pages，tag 触发的部署会被环境规则
# 直接拒绝（表现为 deploy job 0 个 step 就 failure，日志还抓不到）。既然内建构建
# 本来就会把 main 上的 index.json 发布出去，就没必要再自己 deploy 一遍。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      repo_url:
        description: '仓库地址（默认用当前仓库）'
        required: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    outputs:
      index-ok: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 显式落到 main：打 tag 触发时 checkout 默认是 detached HEAD，
          # 后面那次 `git commit` + `git push` 会直接失败（"not currently on a branch"）。
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 跑一遍离线测试（索引指向一个跑不起来的东西没有意义）
        run: |
          for t in vault sync host client archive history; do
            echo "::group::$t"
            node "test/$t.test.mjs"
            echo "::endgroup::"
          done

      - id: build
        name: 生成 index.json
        run: node scripts/build-index.mjs --repo "${{ github.server_url }}/${{ github.repository }}"

      - name: 提交 index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json 无变化"
            exit 0
          fi
          git commit -m "chore: publish plugin index for ${GITHUB_REF_NAME}"
          # main 可能在这几十秒里被别人（或上一次手动推送）动过，先把本地提交挪到最新
          # main 之上再推；直接 push 一旦被拒，这次发版的索引就静默地没上去。
          git pull --rebase --autostash origin main
          git push origin HEAD:main
