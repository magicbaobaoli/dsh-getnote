name: Publish plugin index

# DSH 没有中心化的插件审核：索引就是一份静态 JSON，谁把它放到静态主机上谁就能
# 被安装。这个 workflow 在每次发版（打 v* 标签）时重新生成 index.json 并发布到
# GitHub Pages，用户把它当作「索引源」地址填进 DSH 的插件市场即可。
#
# 关键点：index.json 里的 git 源必须钉到具体 commit，而那个 commit 必须包含
# 本次发布的内容 —— 所以生成索引要放在 checkout 之后、且生成结果要提交进仓库，
# 否则「索引指向的 commit」里没有 index.json 自己（对安装没影响，但会让人困惑）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      repo_url:
        description: '仓库地址（默认用当前仓库）'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    outputs:
      index-ok: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 跑一遍离线测试（索引指向一个跑不起来的东西没有意义）
        run: |
          for t in vault sync host client; do
            echo "::group::$t"
            node "test/$t.test.mjs"
            echo "::endgroup::"
          done

      - id: build
        name: 生成 index.json
        run: node scripts/build-index.mjs --repo "${{ github.server_url }}/${{ github.repository }}"

      - name: 提交 index.json 并打 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json 无变化"
          else
            git commit -m "chore: publish plugin index for ${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
